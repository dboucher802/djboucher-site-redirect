<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJBoucher.com</title>
<meta name="description" content="Welcome to DJBoucher.com. Visit DJBoucher.Photography or Vizulyze.com for more information.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>DB</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5c5c5c;
    --rule: #e2e2e2;
    --link: #1a4f8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #eceef1;
      --muted: #a0a6ad;
      --rule: #2b2f36;
      --link: #7fb2e8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  main {
    width: 100%;
    max-width: 34rem;
    text-align: center;
  }
  h1 {
    margin: 0 0 1.5rem;
    font-size: clamp(1.75rem, 6vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .rule {
    width: 3rem;
    height: 2px;
    margin: 0 auto 1.5rem;
    background: var(--rule);
    border: 0;
  }
  p {
    margin: 0 0 2rem;
    color: var(--muted);
  }
  .sites {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .sites a {
    display: block;
    padding: 0.7rem 1.4rem;
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--link);
    text-decoration: none;
    font-weight: 500;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .sites a:hover,
  .sites a:focus-visible {
    border-color: var(--link);
    transform: translateY(-1px);
  }
  .sites a:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
  }
  footer {
    margin-top: 3rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>Welcome to DJBoucher.com</h1>
  <hr class="rule">
  <p>Please visit one of the sites below for more information.</p>
  <ul class="sites">
    <li><a href="https://djboucher.photography">DJBoucher.Photography</a></li>
    <li><a href="https://vizulyze.com">Vizulyze.com</a></li>
  </ul>
  <footer>&copy; <span id="y">2026</span> Dennis Boucher</footer>
</main>
<script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
